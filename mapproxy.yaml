services:
  demo:
  wms:
    md:
      title: ArcGIS Satellite via MapProxy
      abstract: This is the fantastic MapProxy.
  wmts:

layers:
  - name: arcgis_satellite
    title: ArcGIS World Imagery (Cached)
    sources: [arcgis_satellite_cache]

caches:
  arcgis_satellite_cache:
    grids: [webmercator]
    sources: [arcgis_satellite_source]
    format: image/png
    meta_size: [4, 4]     # 一次请求 4×4 瓦片
    meta_buffer: 128      # 防止边缘裁剪问题
    cache:
      type: file
      directory: ./cache_data/arcgis_satellite

sources:
  arcgis_satellite_source:
    type: tile
    grid: webmercator
    url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/%(z)s/%(y)s/%(x)s

grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR    # EPSG:3857 全球Web地图标准

globals:
  cache:
    base_dir: ./cache_data
    lock_dir: ./cache_data/locks
  image:
    resampling_method: bicubic
