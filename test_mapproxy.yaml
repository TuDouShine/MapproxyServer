services:
  wms: {}
  wmts: {}
layers:
  - name: my_layer
    title: my layer
    sources: [my_cache]
caches:
  my_cache:
    grids: [my_grid]
    sources: [my_source]
    cache:
      type: file
      directory: ./test_cache_dir
sources:
  my_source:
    type: tile
    grid: GLOBAL_WEBMERCATOR
    url: https://a.tile.openstreetmap.org/%(z)s/%(x)s/%(y)s.png
grids:
  my_grid:
    base: GLOBAL_WEBMERCATOR
    res: [
      156543.03392804097,
      78271.51696402048,
      39135.75848201024
    ] # Only levels 0, 1, 2
